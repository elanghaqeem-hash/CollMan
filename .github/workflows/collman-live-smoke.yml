name: CollMan live production read-only probe
on:
  push:
    branches: ["migration/vercel-postgres"]
    paths:
      - "scripts/verify-preview.mjs"
      - ".github/workflows/collman-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLLMAN_BASE_URL: https://collman-lemon.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check public domain without mutations or credentials
        run: node scripts/verify-preview.mjs
